name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: chatgpt2api

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          CHATGPT2API_AUTH_KEY: test-auth
        run: >-
          uv run pytest -q
          test/test_gpt_accounts_manager.py
          test/test_gpt_accounts_manager_storage.py
          test/test_config.py
          test/test_database_storage.py
          test/test_image_remove_conversation.py
          test/test_model_catalog_service.py
          test/test_text_model_routing.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck

      - name: Get upstream release metadata
        id: upstream
        run: python3 .github/scripts/get_upstream_release.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          labels: |
            io.wen.upstream.repo=git@github.com:basketikun/chatgpt2api.git
            io.wen.upstream.tag=${{ steps.upstream.outputs.tag }}
            io.wen.upstream.revision=${{ steps.upstream.outputs.revision }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deploy webhook
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          WEBHOOK_URL: https://gpt-pool.com/_github-webhook/chatgpt2api
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python3 .github/scripts/trigger_webhook.py
