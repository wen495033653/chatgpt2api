name: chatgpt2api

services:
  chatgpt2api:
    image: ghcr.io/wen495033653/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-19319}:80"
    env_file:
      - /mydata/chatgpt2api/.env
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      GPT_ACCOUNTS_MANAGER_URL: ${GPT_ACCOUNTS_MANAGER_URL:-http://gpt-accounts-manager:19318}
      GPT_ACCOUNTS_MANAGER_SYNC_INTERVAL_SECONDS: ${GPT_ACCOUNTS_MANAGER_SYNC_INTERVAL_SECONDS:-300}
      GPT_ACCOUNTS_MANAGER_PLAN: ${GPT_ACCOUNTS_MANAGER_PLAN:-}
    volumes:
      - /mydata/chatgpt2api/data:/app/data
      - /mydata/chatgpt2api/config.json:/app/config.json
    networks:
      - app_net

networks:
  app_net:
    name: ${DOCKER_NETWORK:-new-api_default}
    external: ${DOCKER_NETWORK_EXTERNAL:-true}
